name: Build Mod JAR

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # Мы подняли версию Gradle до 8.9, чтобы она полностью подошла под требования Fabric Loom
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'

    - name: Build with Gradle
      run: gradle build --no-daemon -x test

    - name: Upload JAR as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: bamchik-client-ready
        path: |
          build/libs/*.jar
          *.jar
